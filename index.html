<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stepan Nikulenko — Portfolio</title>
    <meta name="color-scheme" content="dark" />
    <!--
      Paints the dark --paper and the loader before the CSS/JS bundle arrives, so
      slow loads aren't white. Values mirror tokens.css; Hero adds .done when ready.
    -->
    <style>
      html {
        background: #0d0d0c;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #0d0d0c;
        transition:
          opacity 0.5s cubic-bezier(0.22, 0.7, 0.2, 1),
          visibility 0.5s;
      }

      /* a highlight sweeping along a hairline */
      #boot-loader::after {
        content: '';
        width: 120px;
        height: 1px;
        background:
          linear-gradient(90deg, transparent, #e9e5db, transparent) 0 0 / 50% 100% no-repeat,
          #3a3936;
        animation: boot-scan 1.1s cubic-bezier(0.22, 0.7, 0.2, 1) infinite;
      }

      #boot-loader.done {
        opacity: 0;
        visibility: hidden;
      }

      @keyframes boot-scan {
        from {
          background-position: -100% 0, 0 0;
        }
        to {
          background-position: 200% 0, 0 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-loader::after {
          animation: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Loading"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
